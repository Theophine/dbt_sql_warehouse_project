sources:
  - name: dbo
    database: |
      {%- if  target.name == "dev" -%} dbt_warehouse
      {%- elif target.name == "prod"  -%} dbt_prod_warehouse
      {%- else -%} dbt_warehouse
      {%- endif -%}
    schema: dbo
    freshness:
      warn_after:
        count: 3300
        period: day
    loaded_at_field: created_at

    tables:
      - name: orders_incremental
      - name: orders
      - name: products
      - name: reviews
      - name: users


  